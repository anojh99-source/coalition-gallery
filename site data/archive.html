<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Coalition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&display=swap');

:root {
  --black: #070707; --black-2: #0d0d0d; --black-3: #111111;
  --white: #f0f0f0; --acid: #c8ff00; --border: rgba(240,240,240,0.08);
  --font-display: 'Bebas Neue', sans-serif;
  --font-ui: 'Barlow Condensed', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { background: var(--black); color: var(--white); font-family: var(--font-body); overflow-x: hidden; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--black); }
::-webkit-scrollbar-thumb { background: var(--acid); }
::selection { background: var(--acid); color: var(--black); }

.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; padding: 20px 48px;
  background: rgba(7,7,7,0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: background 0.4s, padding 0.4s;
}
.nav.scrolled { background: rgba(7,7,7,0.95); padding: 14px 48px; border-bottom: 1px solid var(--border); }

.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo-mark {
  width: 44px; height: 44px;
  border: 1.5px solid var(--white); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s;
}
.nav-logo:hover .nav-logo-mark { border-color: var(--acid); }
.nav-logo-mark span { font-family: var(--font-ui); font-weight: 700; font-size: 8px; letter-spacing: 0.3px; color: var(--white); }

.nav-links { justify-self: center; display: flex; gap: 40px; list-style: none; }
.nav-links a {
  font-family: var(--font-ui);
  font-size: 14px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: rgba(240,240,240,0.9);
  text-decoration: none; transition: color 0.25s;
  position: relative; padding-bottom: 4px;
}
.nav-links a::after {
  content: ''; position: absolute;
  bottom: -2px; left: 0; width: 0; height: 1px;
  background: var(--acid); transition: width 0.3s ease;
}
.nav-links a:hover { color: var(--white); }
.nav-links a:hover::after { width: 100%; }
.nav-links a.active { color: var(--white); }
.nav-links a.active::after { width: 100%; }

.nav-cta {
  justify-self: end;
  font-family: var(--font-ui); font-weight: 700;
  font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--black); background: var(--acid);
  padding: 10px 24px; text-decoration: none;
  transition: opacity 0.2s; display: inline-block;
}
.nav-cta:hover { opacity: 0.88; }

.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; z-index: 110; justify-self: end; }
.hamburger span { display: block; width: 24px; height: 1.5px; background: var(--white); transition: transform 0.3s, opacity 0.3s; }
.hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-menu { display: none; position: fixed; inset: 0; background: rgba(7,7,7,0.97); z-index: 105; flex-direction: column; align-items: center; justify-content: center; gap: 40px; backdrop-filter: blur(8px); }
.mobile-menu.open { display: flex; }
.mobile-menu a { font-family: var(--font-display); font-size: 48px; letter-spacing: 4px; color: rgba(240,240,240,0.7); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
.mobile-menu a:hover { color: var(--acid); }
.mobile-menu .mobile-cta { margin-top: 20px; background: var(--acid); color: var(--black); font-family: var(--font-ui); font-weight: 700; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; padding: 14px 36px; text-decoration: none; }

@media (max-width: 768px) {
  .nav-links { display: none; }
  .nav-cta { display: none; }
  .hamburger { display: flex; }
  .nav { padding: 16px 24px; }
}

.page-header {
  padding: 140px 48px 40px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.page-title {
  font-family: var(--font-display);
  font-size: clamp(56px, 9vw, 120px);
  line-height: 0.92; letter-spacing: 2px; color: var(--white);
}
.page-title span { color: var(--acid); }

.photo-count { text-align: right; padding-bottom: 12px; }
.photo-count-num {
  font-family: var(--font-display); font-size: 56px;
  color: rgba(240,240,240,0.14); line-height: 1;
}
.photo-count-label {
  font-family: var(--font-ui); font-size: 10px;
  letter-spacing: 3px; text-transform: uppercase;
  color: rgba(240,240,240,0.3);
}

/* EVENT TAB NAV */
.event-tabs {
  display: flex;
  gap: 2px;
  padding: 24px 48px 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  background: var(--black);
}

.event-tab {
  font-family: var(--font-ui);
  font-size: 12px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(240,240,240,0.4);
  background: none;
  border: none;
  padding: 14px 24px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.event-tab:hover { color: var(--white); }
.event-tab.active { color: var(--acid); border-color: var(--acid); }

/* EVENT DISPLAY */
.event-display {
  padding: 48px 48px 72px;
}

.event-display-head {
  display: flex; align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 36px; gap: 24px;
  flex-wrap: wrap;
}

.event-display-meta { display: flex; flex-direction: column; gap: 8px; }

.event-display-tag {
  font-family: var(--font-ui);
  font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--acid);
}

.event-display-name {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 64px);
  letter-spacing: 2px; color: var(--white); line-height: 1;
}

.event-display-date {
  font-family: var(--font-ui);
  font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(240,240,240,0.4);
}

.full-gallery-btn {
  font-family: var(--font-ui); font-weight: 700;
  font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--black); background: var(--acid);
  padding: 12px 24px; text-decoration: none;
  transition: opacity 0.2s; display: inline-block;
  white-space: nowrap;
}
.full-gallery-btn:hover { opacity: 0.88; }

/* MASONRY GRID */
.masonry {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
}

.m-thumb {
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--black-3);
}

.m-thumb:nth-child(7n+1) { grid-column: span 2; grid-row: span 2; }

.m-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease, filter 0.4s ease;
  filter: brightness(0.85) saturate(0.95);
  display: block;
}

.m-thumb:hover img {
  transform: scale(1.04);
  filter: brightness(1) saturate(1);
}

.m-thumb-overlay {
  position: absolute; inset: 0;
  background: rgba(7,7,7,0);
  transition: background 0.3s;
  display: flex; align-items: flex-end;
  padding: 14px;
}
.m-thumb:hover .m-thumb-overlay { background: rgba(7,7,7,0.3); }

.m-label {
  font-family: var(--font-ui);
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(240,240,240,0);
  transition: color 0.3s;
}
.m-thumb:hover .m-label { color: var(--white); }

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 1000;
  align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }

.lightbox img {
  max-width: 92vw; max-height: 92vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 28px; right: 36px;
  font-family: var(--font-ui);
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(240,240,240,0.5);
  cursor: pointer; background: none; border: none;
  transition: color 0.2s;
}
.lightbox-close:hover { color: var(--white); }

.lightbox-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: none; border: none;
  color: rgba(240,240,240,0.4);
  font-size: 32px; cursor: pointer;
  padding: 12px 20px;
  transition: color 0.2s;
}
.lightbox-nav:hover { color: var(--acid); }
.lightbox-prev { left: 24px; }
.lightbox-next { right: 24px; }

.lightbox-counter {
  position: absolute;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-ui); font-size: 11px;
  letter-spacing: 3px; color: rgba(240,240,240,0.4);
}

footer {
  border-top: 1px solid var(--border);
  padding: 32px 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-copy {
  font-family: var(--font-ui); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(240,240,240,0.2);
}
.footer-links { display: flex; gap: 32px; list-style: none; }
.footer-links a {
  font-family: var(--font-ui); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(240,240,240,0.3); text-decoration: none;
  transition: color 0.2s;
}
.footer-links a:hover { color: var(--white); }

body { animation: fadeIn 0.6s ease forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 768px) {
  .page-header { padding: 120px 24px 32px; flex-direction: column; align-items: flex-start; gap: 20px; }
  .event-tabs { padding: 16px 24px 0; }
  .event-display { padding: 32px 24px 56px; }
  .event-display-head { flex-direction: column; align-items: flex-start; }
  .masonry { grid-template-columns: repeat(2, 1fr); gap: 2px; }
  .m-thumb:nth-child(7n+1) { grid-column: span 2; }
  footer { padding: 24px; flex-direction: column; gap: 16px; text-align: center; }
}
</style>

window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);
});

document.addEventListener('DOMContentLoaded', function() {
  const hamburger  = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  if (!hamburger || !mobileMenu) return;
  hamburger.addEventListener('click', function() {
    const isOpen = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
});

let currentEvent = EVENTS[0];
let lbIndex = 0;

// BUILD TABS
const tabsContainer = document.getElementById('eventTabs');
EVENTS.forEach((e, i) => {
  const btn = document.createElement('button');
  btn.className = 'event-tab' + (i === 0 ? ' active' : '');
  btn.textContent = e.tag;
  btn.addEventListener('click', () => switchEvent(e.id));
  tabsContainer.appendChild(btn);
});

// SWITCH EVENT
function switchEvent(id) {
  const event = EVENTS.find(e => e.id === id);
  if (!event) return;
  currentEvent = event;
  renderDisplay();

  document.querySelectorAll('.event-tab').forEach(tab => {
    tab.classList.toggle('active', tab.textContent === event.tag);
  });
}

// RENDER DISPLAY
function renderDisplay() {
  document.getElementById('displayTag').textContent = currentEvent.tag;
  document.getElementById('displayName').textContent = currentEvent.name;
  document.getElementById('displayDate').textContent = currentEvent.date;
  document.getElementById('fullGalleryBtn').href = currentEvent.gallery;

  const grid = document.getElementById('gallery');
  grid.innerHTML = currentEvent.photos.map((src, i) => `
    <div class="m-thumb" data-index="${i}">
      <img src="${src}" alt="${currentEvent.name} photo" loading="lazy">
      <div class="m-thumb-overlay"><span class="m-label">View</span></div>
    </div>`).join('');

  grid.querySelectorAll('.m-thumb').forEach(t => {
    t.addEventListener('click', () => openLightbox(+t.dataset.index));
  });
}

// LIGHTBOX
function openLightbox(i) {
  lbIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  document.getElementById('lbImg').src = currentEvent.photos[lbIndex];
  document.getElementById('lbCounter').textContent = `${lbIndex + 1} / ${currentEvent.photos.length}`;
}

document.getElementById('lbClose').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
});

document.getElementById('lbPrev').addEventListener('click', () => {
  lbIndex = (lbIndex - 1 + currentEvent.photos.length) % currentEvent.photos.length;
  updateLightbox();
});
document.getElementById('lbNext').addEventListener('click', () => {
  lbIndex = (lbIndex + 1) % currentEvent.photos.length;
  updateLightbox();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') document.getElementById('lbClose').click();
  if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
});

// INIT
const totalPhotos = EVENTS.reduce((sum, e) => sum + e.photos.length, 0);
document.getElementById('photoCount').textContent = totalPhotos;
renderDisplay();
</script>

</body>
</html>
